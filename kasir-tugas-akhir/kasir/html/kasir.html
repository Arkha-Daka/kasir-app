<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Kantin Sekolah</title>
  <link rel="stylesheet" href="../css/kasir.css">
</head>
<body>

<!-- ══════════ TOPBAR ══════════ -->
<header class="topbar">
  <div class="brand">
    <div class="brand-logo">KS</div>
    <div class="brand-text">
      <span class="brand-name">Kantin<span>Sekolah</span></span>
      <p>Cashier Panel</p>
    </div>
  </div>
  <div class="topbar-right">
    <span class="topbar-badge" id="kasirBadge">Kasir</span>
    <button class="btn-theme" id="toggleTheme" onclick="toggleTheme()">🌙</button>
    <button class="btn btn-logout" onclick="logoutKasir()">Logout</button>
  </div>
</header>

<!-- ══════════ MAIN ══════════ -->
<div class="wrapper">

  <!-- ── LEFT COLUMN ── -->
  <div class="left-col">

    <!-- Input Barang -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">Input Barang</span>
      </div>
      <div class="card-body">

        <div class="field">
          <label class="field-label">Cari Produk</label>
          <input type="text" id="searchProduk" placeholder="Ketik nama atau kode barang...">
          <div class="suggest-list" id="produkSuggestions"></div>
        </div>

        <div class="field">
          <label class="field-label">Kategori</label>
          <div class="quick-grid select-holder" id="kategoriCepat"></div>
        </div>

        <div class="field">
          <label class="field-label">Produk Terlaris</label>
          <div class="popular-grid select-holder" id="produkPopuler">
            <div class="mini-empty">Memuat produk...</div>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Kode / Barcode</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="barcodeInput" placeholder="Scan atau ketik kode..." style="flex:1">
            <button class="btn btn-accent" id="btnCek" onclick="cekBarang()">🔍</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label">Nama Barang</label>
          <input type="text" id="namaBarang" readonly placeholder="—">
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field-label">Harga Satuan</label>
            <input type="text" id="hargaBarang" readonly placeholder="—" class="mono">
          </div>
          <div class="field">
            <label class="field-label">Jumlah</label>
            <input type="number" id="jumlahBarang" placeholder="0" min="1" class="mono">
          </div>
        </div>

        <button class="btn btn-add" id="btnKeranjang" onclick="tambahKeKasir()">
          ＋ Tambah ke Keranjang
        </button>

      </div>
    </div>

  </div><!-- /left -->

  <!-- ── RIGHT COLUMN ── -->
  <div class="right-col">
    <div class="card">
      <div class="card-head">
        <span class="card-title">Keranjang Belanja</span>
        <button class="btn btn-red btn-sm" onclick="resetKeranjang()">Reset</button>
      </div>
      <div class="card-body">

        <!-- Table -->
        <div class="table-wrap">
          <table id="kasirTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Nama Barang</th>
                <th>Harga</th>
                <th>Qty</th>
                <th>Subtotal</th>
                <th style="text-align:center">Aksi</th>
              </tr>
            </thead>
            <tbody id="dataKasir">
              <tr>
                <td colspan="6">
                  <div class="empty">
                    <div class="empty-icon">🛒</div>
                    <p>Keranjang masih kosong</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Summary -->
        <div class="summary" id="summaryBox" style="display:none">
          <div class="sum-row">
            <span>Subtotal</span>
            <span class="val" id="sumSubtotal">Rp 0</span>
          </div>
          <div class="sum-row" id="discRow" style="display:none">
            <span>Diskon 10% <span class="badge badge-green">&gt; Rp 100.000</span></span>
            <span class="val green" id="sumDiskon">— Rp 0</span>
          </div>
          <div class="sum-row">
            <span>PPN 11% <span class="badge badge-yellow">Pajak</span></span>
            <span class="val" id="sumPPN">Rp 0</span>
          </div>
          <hr class="sum-divider">
          <div class="sum-total">
            <span>Total Bayar</span>
            <span class="val" id="sumTotal">Rp 0</span>
          </div>
        </div>

        <!-- Payment Method -->
        <div id="payMethodWrap" style="display:none">
          <div class="field">
            <label class="field-label">Metode Pembayaran</label>
            <select class="pay-select" id="metodeBayar" onchange="renderPayment()">
              <option value="cash">💵 Tunai / Cash</option>
              <option value="qris">📱 QRIS</option>
              <option value="transfer">🏦 Transfer Bank</option>
            </select>
          </div>
          <div id="paymentArea"></div>
        </div>

      </div>
    </div>
  </div><!-- /right -->

</div><!-- /wrapper -->

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- RECEIPT -->
<div class="overlay" id="receiptOverlay">
  <div class="modal receipt-modal">
    <div class="modal-header">
      <div class="modal-title">Struk Transaksi</div>
      <div class="modal-sub" id="receiptSubtitle"></div>
    </div>

    <div class="receipt-paper" id="receiptContent"></div>

    <div class="modal-footer no-print">
      <button class="btn btn-ghost" onclick="closeReceipt()">Tutup</button>
      <button class="btn btn-accent" onclick="printReceipt()">Cetak</button>
    </div>
  </div>
</div>

<script type="module" src="../js/kasir.js"></script>
</body>
</html>
