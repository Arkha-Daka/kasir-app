<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login Kasir</title>

  <link rel="icon" type="image/png"
    href="../../assets/favicon.png">

  <link rel="stylesheet"
    href="../css/login-kasir.css">

</head>
<body>

<div class="login-scene">
  <div class="login-shape shape-one"></div>
  <div class="login-shape shape-two"></div>
  <div class="login-shape shape-three"></div>
</div>

<div class="login-container">

  <div class="login-card">

    <div class="login-brand">
      <div class="login-logo">
        <img src="../../assets/logo.png" alt="Logo Kantin Sekolah">
      </div>
      <div>
        <h1>
          Login Kasir
        </h1>

        <p>
          Siap melayani transaksi kantin
        </p>
      </div>
    </div>

    <input
      type="text"
      id="username"
      class="input"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      class="input"
      placeholder="Password"
    >

    <button
      class="login-btn"
      id="loginBtn">

      Login

    </button>

    <div
      class="error-text"
      id="errorText">

    </div>

    <div class="login-foot">
      Kantin Sekolah POS
    </div>

  </div>

</div>

<script type="module"
  src="../js/login-kasir.js">

</script>

</body>
</html>
